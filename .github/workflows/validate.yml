name: Model and adapter validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest
      - run: python -m symbiont_imcbath simulate --profile symbiont-reference --method pfba
  memote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[qa]'
      - name: Audit upstream model (quality failures remain visible)
        run: python scripts/run_memote.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memote-audit
          path: reports/generated/
          if-no-files-found: error
  m10:
    name: M10 scientific service tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/m10:${{ github.workspace }}/src
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: m10/requirements-lock.txt
      - name: Install locked M10 dependencies
        run: python -m pip install -r m10/requirements-lock.txt
      - name: Install the local adapter without changing the lock
        run: python -m pip install --no-deps -e .
      - name: Check dependency consistency
        run: python -m pip check
      - name: Test M10 using synthetic fixtures
        env:
          M10_DATA_DIR: ${{ runner.temp }}/m10-test-data
        run: python -m pytest m10/tests --junitxml=reports/generated/m10-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m10-test-results
          path: reports/generated/m10-tests.xml
          if-no-files-found: warn
