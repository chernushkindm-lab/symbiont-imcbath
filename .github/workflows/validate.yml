name: Model and adapter validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest
      - run: python -m symbiont_imcbath simulate --profile symbiont-reference --method pfba
  memote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[qa]'
      - name: Audit upstream model (quality failures remain visible)
        run: python scripts/run_memote.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memote-audit
          path: reports/generated/
          if-no-files-found: error
